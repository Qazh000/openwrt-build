      # 验证目标架构、BTF 和 10G 根分区配置
      - name: Verify configuration
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "========== 当前关键配置 =========="
          grep -E '^(CONFIG_TARGET_x86|CONFIG_KERNEL_DEBUG_INFO|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_VMDK_IMAGES)' .config || true
          echo "=================================="

          check_config() {
            key="$1"
            expected="$2"

            actual="$(grep -E "^${key}=" .config | head -n 1 || true)"

            if [ "$actual" != "${key}=${expected}" ]; then
              echo "配置错误：期望 ${key}=${expected}"
              echo "实际值：${actual:-未设置}"
              exit 1
            fi

            echo "通过：${actual}"
          }

          check_config CONFIG_TARGET_x86 y
          check_config CONFIG_TARGET_x86_64 y
          check_config CONFIG_KERNEL_DEBUG_INFO y
          check_config CONFIG_KERNEL_DEBUG_INFO_BTF y
          check_config CONFIG_KERNEL_DEBUG_INFO_REDUCED n
          check_config CONFIG_TARGET_ROOTFS_PARTSIZE 10240

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "错误：CONFIG_VMDK_IMAGES 不应启用"
            exit 1
          fi

          echo "通过：CONFIG_VMDK_IMAGES 未启用"
          echo "所有配置校验通过"
