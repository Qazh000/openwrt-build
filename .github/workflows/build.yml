```yaml
# ============================================================
# OpenWrt x86_64 官方源码编译
#
# 功能：
# 1. 自动获取最新稳定版 OpenWrt
# 2. 使用官方 openwrt/openwrt 源码
# 3. 构建官方 x86_64 镜像
# 4. 仅额外开启 Kernel BTF
# 5. RootFS 分区调整为 10 GiB
# 6. 官方 IMG 转换为 VMDK
# 7. 计算 VMDK 文件 SHA256
# 8. VMDK + SHA256 压缩成 ZIP
# 9. GitHub Release 只上传 ZIP
#
# 注意：
# - 不使用 main 开发分支
# - 不使用第三方 BTF 内核
# - 不启用 VMDK_IMAGES
# - 不修改其他 OpenWrt 默认功能
# ============================================================

name: Build OpenWrt x86_64 BTF 10G VMDK


# ============================================================
# 手动运行 Workflow
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# GitHub Actions 权限
#
# contents: write
# 用于创建 GitHub Release 并上传 ZIP
# ============================================================

permissions:
  contents: write


# ============================================================
# Job
# ============================================================

jobs:
  build:

    # GitHub 官方 Ubuntu 24.04 Runner
    runs-on: ubuntu-24.04

    # 最大运行时间 6 小时
    timeout-minutes: 360

    steps:

      # ======================================================
      # 1. 自动获取最新稳定版 OpenWrt
      #
      # 只匹配正式版本：
      # v25.12.5
      # v25.12.4
      # v26.01.0
      #
      # 不匹配：
      # main
      # snapshot
      # rc
      # beta
      # ======================================================

      - name: Find latest stable OpenWrt
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION="$(
            git ls-remote --tags --refs https://github.com/openwrt/openwrt.git \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )

          if [ -z "$LATEST_VERSION" ]; then
            echo "Failed to find latest stable OpenWrt version."
            exit 1
          fi

          echo "Latest stable OpenWrt: $LATEST_VERSION"

          # 保存版本号供后续步骤使用
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 2. 下载官方 OpenWrt 源码
      #
      # 使用 openwrt/openwrt 官方仓库
      # ref 使用上一步自动检测到的稳定版本
      # ======================================================

      - name: Checkout official OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ steps.stable.outputs.version }}
          fetch-depth: 1


      # ======================================================
      # 3. 安装编译依赖
      #
      # 这些只是在 GitHub Runner 上安装编译工具，
      # 不会改变 OpenWrt 固件配置。
      # ======================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip


      # ======================================================
      # 4. 更新 OpenWrt 官方 feeds
      #
      # 使用 OpenWrt 自己的 feeds 配置。
      # 不添加第三方软件源。
      # ======================================================

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ======================================================
      # 5. 选择 x86_64 架构
      #
      # x86 平台本身没有额外 Device Profile。
      # 这里只选择官方 x86 / x86_64 Target。
      # ======================================================

      - name: Select x86_64 target
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable TARGET_x86 \
            --enable TARGET_x86_64


      # ======================================================
      # 6. 开启 Kernel BTF
      #
      # OpenWrt 官方 Kconfig 中：
      #
      # KERNEL_DEBUG_INFO_BTF
      # 依赖：
      # KERNEL_DEBUG_INFO
      # 并且不能开启：
      # KERNEL_DEBUG_INFO_REDUCED
      #
      # 所以这里按照官方依赖关系开启。
      # ======================================================

      - name: Enable BTF
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable KERNEL_DEBUG_INFO \
            --enable KERNEL_DEBUG_INFO_BTF \
            --disable KERNEL_DEBUG_INFO_REDUCED


      # ======================================================
      # 7. RootFS 分区设置为 10 GiB
      #
      # OpenWrt 的单位是 MiB。
      #
      # 10240 MiB = 10 GiB
      #
      # 注意：
      # 这里设置的是 RootFS 分区总大小，
      # 不是“剩余可写空间”正好 10 GiB。
      # ======================================================

      - name: Set RootFS partition size to 10 GiB
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --set-val TARGET_ROOTFS_PARTSIZE 10240


      # ======================================================
      # 8. 根据 OpenWrt 官方默认配置生成最终 .config
      #
      # make defconfig 会自动处理 Kconfig 依赖关系。
      # ======================================================

      - name: Generate default configuration
        shell: bash
        run: |
          set -euo pipefail

          make defconfig


      # ======================================================
      # 9. 检查最终配置
      #
      # 确认：
      # - x86 已选择
      # - x86_64 已选择
      # - BTF 已开启
      # - DEBUG_INFO 已开启
      # - DEBUG_INFO_REDUCED 已关闭
      # - RootFS = 10240 MiB
      # - VMDK_IMAGES 没有被开启
      # ======================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Target ====="

          grep -E '^CONFIG_TARGET_x86(_64)?=y$' .config || true


          echo
          echo "===== BTF ====="

          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?=' .config || true


          echo
          echo "===== RootFS ====="

          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true


          echo
          echo "===== VMDK_IMAGES ====="

          grep -E '^CONFIG_VMDK_IMAGES=' .config || true


          echo
          echo "===== Verification ====="


          # 必须是 x86
          grep -q '^CONFIG_TARGET_x86=y$' .config

          # 必须是 x86_64
          grep -q '^CONFIG_TARGET_x86_64=y$' .config


          # 必须开启 Kernel Debug Info
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config

          # 必须开启 BTF
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config

          # 不允许开启 Reduced Debug Info
          ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config


          # RootFS 必须为 10240 MiB
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config


          # 不允许开启官方 VMDK_IMAGES
          #
          # 因为 VMDK_IMAGES 会额外选择 kmod-e1000。
          # 我们按照要求只开启 BTF，不额外改变固件功能。
          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES must remain disabled."
            exit 1
          fi


          echo
          echo "Configuration verification passed."


      # ======================================================
      # 10. 下载软件包源码
      #
      # 使用 OpenWrt 官方 feeds。
      # ======================================================

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)"


      # ======================================================
      # 11. 编译 OpenWrt
      #
      # 使用 GitHub Runner 全部 CPU 核心。
      # V=s 输出详细编译日志，方便排查错误。
      # ======================================================

      - name: Build OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=s


      # ======================================================
      # 12. 找到官方 x86_64 EFI SquashFS 镜像
      #
      # 目标：
      #
      # squashfs-combined-efi.img.gz
      #
      # 这是官方 x86_64 Combined EFI 镜像。
      # ======================================================

      - name: Locate official x86_64 image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*squashfs*combined-efi.img.gz' \
              | head -n 1
          )


          # 如果没有找到镜像，输出当前目录中的所有镜像，
          # 方便查看实际生成了什么文件。
          if [ -z "$IMAGE" ]; then

            echo "OpenWrt x86_64 combined EFI image not found."

            echo
            echo "Available images:"

            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi


          echo "Found image:"
          echo "$IMAGE"


          # 保存镜像路径供后续步骤使用
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 13. 解压官方 IMG
      #
      # OpenWrt 官方 x86 镜像通常为 .img.gz。
      #
      # 这里仅进行 gzip 解压，
      # 不修改 IMG 内部内容。
      # ======================================================

      - name: Extract raw IMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work output


          gzip -dc \
            "${{ steps.image.outputs.image }}" \
            > work/OpenWrt-x86_64-BTF-10G.img


          echo
          echo "===== Raw IMG ====="

          ls -lh work/OpenWrt-x86_64-BTF-10G.img


      # ======================================================
      # 14. IMG 转 VMDK
      #
      # 使用 qemu-img 官方标准转换方式：
      #
      # raw -> vmdk
      #
      # 不使用 streamOptimized。
      # ======================================================

      - name: Convert IMG to VMDK
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk


          echo
          echo "===== VMDK ====="

          ls -lh output/OpenWrt-x86_64-BTF-10G.vmdk


          echo
          echo "===== VMDK info ====="

          qemu-img info output/OpenWrt-x86_64-BTF-10G.vmdk


      # ======================================================
      # 15. 计算 VMDK SHA256
      #
      # 注意：
      # 计算的是“未压缩 VMDK 文件”的 SHA256。
      #
      # 不是 ZIP 的 SHA256。
      # ======================================================

      - name: Generate VMDK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd output


          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256


          echo
          echo "===== VMDK SHA256 ====="

          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256


      # ======================================================
      # 16. 将 VMDK + SHA256 压缩成 ZIP
      #
      # ZIP 内最终只有两个文件：
      #
      # OpenWrt-x86_64-BTF-10G.vmdk
      # OpenWrt-x86_64-BTF-10G.vmdk.sha256
      # ======================================================

      - name: Compress VMDK
        shell: bash
        run: |
          set -euo pipefail

          cd output


          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256


          echo
          echo "===== ZIP ====="

          ls -lh OpenWrt-x86_64-BTF-10G.zip


      # ======================================================
      # 17. 删除中间文件
      #
      # Release 最终只保留 ZIP。
      #
      # 删除：
      # - IMG
      # - VMDK
      # - SHA256
      #
      # 保留：
      # - ZIP
      # ======================================================

      - name: Remove intermediate files
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk \
            output/OpenWrt-x86_64-BTF-10G.vmdk.sha256


          echo
          echo "===== Remaining files ====="

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'


      # ======================================================
      # 18. 创建 GitHub Release
      #
      # Release 标签：
      # 使用自动检测到的最新稳定版。
      #
      # 上传内容：
      # 只上传 ZIP。
      #
      # 不上传：
      # - IMG
      # - VMDK
      # - SHA256
      # - .config
      # ======================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          # Release Tag
          tag_name: ${{ steps.stable.outputs.version }}

          # Release 名称
          name: OpenWrt ${{ steps.stable.outputs.version }} x86_64 BTF 10G


          # Release 说明
          body: |
            ## OpenWrt x86_64

            - Source: official openwrt/openwrt
            - Target: x86_64
            - Kernel BTF: enabled
            - RootFS partition: 10240 MiB (10 GiB)
            - Image: official x86_64 combined EFI image
            - VMDK: converted from official IMG
            - SHA256: VMDK checksum included


          # Release 只上传 ZIP
          files: |
            output/OpenWrt-x86_64-BTF-10G.zip


          # 标记为 Latest Release
          make_latest: true


          # 如果 ZIP 没找到，直接让 Workflow 失败
          fail_on_unmatched_files: true
```
