# ============================================================
# OpenWrt x86_64 官方源码编译
#
# 功能：
# 1. 自动获取最新稳定版 OpenWrt
# 2. 使用官方 openwrt/openwrt 源码
# 3. 构建官方 x86_64 镜像
# 4. 仅开启 Kernel BTF
# 5. RootFS 分区设置为 10 GiB
# 6. 官方 IMG 转换为 VMDK
# 7. 计算 VMDK SHA256
# 8. VMDK + SHA256 压缩成 ZIP
# 9. GitHub Release 只上传 ZIP
#
# 不使用：
# - OpenWrt main 开发分支
# - 第三方 BTF 内核
# - ImmortalWrt
# - kenzok8/vmlinux-btf
# - VMDK_IMAGES
# ============================================================

name: Build OpenWrt x86_64 BTF 10G VMDK

# ============================================================
# 手动运行
# ============================================================

on:
  workflow_dispatch:

# ============================================================
# GitHub Actions 权限
# 用于创建 Release
# ============================================================

permissions:
  contents: write

# ============================================================
# Jobs
# ============================================================

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ======================================================
      # 1. 获取最新稳定版 OpenWrt
      #
      # 只匹配：
      # v数字.数字.数字
      #
      # 例如：
      # v25.12.5
      #
      # 不匹配：
      # main
      # snapshot
      # rc
      # beta
      # ======================================================

      - name: Find latest stable OpenWrt
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --tags --refs https://github.com/openwrt/openwrt.git \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 > latest_version.txt

          if [ ! -s latest_version.txt ]; then
            echo "Failed to find latest stable OpenWrt version."
            exit 1
          fi

          LATEST_VERSION=$(cat latest_version.txt)

          echo "Latest stable OpenWrt: ${LATEST_VERSION}"
          echo "version=${LATEST_VERSION}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 2. 下载官方 OpenWrt 源码
      # ======================================================

      - name: Checkout official OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ steps.stable.outputs.version }}
          fetch-depth: 1


      # ======================================================
      # 3. 安装编译依赖
      #
      # 这些只是 GitHub Runner 的编译工具。
      # 不会作为额外功能加入 OpenWrt 固件。
      # ======================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip


      # ======================================================
      # 4. 更新 OpenWrt 官方 feeds
      # ======================================================

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ======================================================
      # 5. 选择 x86_64
      #
      # x86 平台没有额外 Device Profile。
      # ======================================================

      - name: Select x86_64 target
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable TARGET_x86 \
            --enable TARGET_x86_64


      # ======================================================
      # 6. 开启 Kernel BTF
      #
      # BTF 官方 Kconfig 依赖：
      #
      # KERNEL_DEBUG_INFO=y
      # KERNEL_DEBUG_INFO_BTF=y
      # KERNEL_DEBUG_INFO_REDUCED=n
      #
      # 只修改 BTF 所需要的配置。
      # ======================================================

      - name: Enable Kernel BTF
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable KERNEL_DEBUG_INFO \
            --enable KERNEL_DEBUG_INFO_BTF \
            --disable KERNEL_DEBUG_INFO_REDUCED


      # ======================================================
      # 7. RootFS 分区设置为 10 GiB
      #
      # OpenWrt 单位为 MiB。
      #
      # 10240 MiB = 10 GiB
      #
      # 注意：
      # 这是 RootFS 分区总大小。
      # 不是剩余可写空间正好 10 GiB。
      # ======================================================

      - name: Set RootFS partition size to 10 GiB
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --set-val TARGET_ROOTFS_PARTSIZE 10240


      # ======================================================
      # 8. 根据 Kconfig 生成最终配置
      # ======================================================

      - name: Generate final configuration
        shell: bash
        run: |
          set -euo pipefail

          make defconfig


      # ======================================================
      # 9. 检查最终配置
      # ======================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Target"
          echo "========================================"

          grep -E '^CONFIG_TARGET_x86(_64)?=y$' .config || true


          echo
          echo "========================================"
          echo "Kernel BTF"
          echo "========================================"

          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?=' .config || true


          echo
          echo "========================================"
          echo "RootFS"
          echo "========================================"

          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true


          echo
          echo "========================================"
          echo "VMDK_IMAGES"
          echo "========================================"

          grep -E '^CONFIG_VMDK_IMAGES=' .config || true


          echo
          echo "========================================"
          echo "Verification"
          echo "========================================"


          if ! grep -q '^CONFIG_TARGET_x86=y$' .config; then
            echo "ERROR: CONFIG_TARGET_x86 is not enabled."
            exit 1
          fi


          if ! grep -q '^CONFIG_TARGET_x86_64=y$' .config; then
            echo "ERROR: CONFIG_TARGET_x86_64 is not enabled."
            exit 1
          fi


          if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO is not enabled."
            exit 1
          fi


          if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_BTF is not enabled."
            exit 1
          fi


          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED must be disabled."
            exit 1
          fi


          if ! grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config; then
            echo "ERROR: RootFS partition size is not 10240 MiB."
            exit 1
          fi


          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES must remain disabled."
            exit 1
          fi


          echo
          echo "Configuration verification passed."


      # ======================================================
      # 10. 下载软件包源码
      # ======================================================

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)"


      # ======================================================
      # 11. 编译 OpenWrt
      # ======================================================

      - name: Build OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=s


      # ======================================================
      # 12. 查找官方 x86_64 EFI SquashFS 镜像
      # ======================================================

      - name: Locate x86_64 image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -name '*squashfs*combined-efi.img.gz' \
            | head -n 1)

          if [ -z "${IMAGE}" ]; then
            echo "OpenWrt x86_64 combined EFI image not found."

            echo
            echo "Available images:"

            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          echo "Found image:"
          echo "${IMAGE}"

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 13. 解压官方 IMG
      # ======================================================

      - name: Extract raw IMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          mkdir -p output

          gzip -dc "${{ steps.image.outputs.image }}" \
            > work/OpenWrt-x86_64-BTF-10G.img

          echo
          echo "Raw IMG:"

          ls -lh work/OpenWrt-x86_64-BTF-10G.img


      # ======================================================
      # 14. IMG 转 VMDK
      #
      # 不使用 streamOptimized。
      # 不使用 OpenWrt VMDK_IMAGES。
      # ======================================================

      - name: Convert IMG to VMDK
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk

          echo
          echo "VMDK:"

          ls -lh output/OpenWrt-x86_64-BTF-10G.vmdk

          echo
          echo "VMDK information:"

          qemu-img info output/OpenWrt-x86_64-BTF-10G.vmdk


      # ======================================================
      # 15. 计算 VMDK SHA256
      #
      # 计算未压缩 VMDK 的 SHA256。
      # ======================================================

      - name: Generate VMDK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd output

          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "VMDK SHA256:"

          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256


      # ======================================================
      # 16. 压缩 VMDK + SHA256
      #
      # ZIP 中只有：
      #
      # OpenWrt-x86_64-BTF-10G.vmdk
      # OpenWrt-x86_64-BTF-10G.vmdk.sha256
      # ======================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd output

          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "ZIP:"

          ls -lh OpenWrt-x86_64-BTF-10G.zip


      # ======================================================
      # 17. 删除中间文件
      #
      # Release 最终只上传 ZIP。
      # ======================================================

      - name: Remove intermediate files
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk \
            output/OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "Remaining files:"

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'


      # ======================================================
      # 18. 创建 GitHub Release
      #
      # 只上传 ZIP。
      # ======================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stable.outputs.version }}
          name: OpenWrt ${{ steps.stable.outputs.version }} x86_64 BTF 10G

          body: |
            ## OpenWrt x86_64

            - Source: official openwrt/openwrt
            - Target: x86_64
            - Kernel BTF: enabled
            - RootFS partition: 10240 MiB (10 GiB)
            - Image: official x86_64 combined EFI
            - VMDK: converted from official IMG
            - SHA256: included inside ZIP

          files: |
            output/OpenWrt-x86_64-BTF-10G.zip

          make_latest: true
          fail_on_unmatched_files: true
