```yaml
# ============================================================
# OpenWrt x86_64 BTF 自动构建
#
# 构建来源：
#   官方 OpenWrt 仓库
#   https://github.com/openwrt/openwrt
#
# 构建目标：
#   x86_64
#
# 主要功能：
#   1. 自动获取 OpenWrt 最新稳定版 Release
#   2. 只启用官方 BTF 支持
#   3. RootFS 分区大小设置为 10GB
#   4. 不启用 OpenWrt 原生 VMDK_IMAGES
#   5. 官方 combined-efi.img.gz 转换为 VMDK
#   6. 不使用 streamOptimized
#   7. 对未压缩 VMDK 本体计算 SHA256
#   8. ZIP 只包含 VMDK 和 SHA256
#   9. GitHub Release 只上传 ZIP
#
# 不使用：
#   - main 分支
#   - ImmortalWrt
#   - kenzok8/vmlinux-btf
#   - 第三方 BTF
#   - 第三方 OpenWrt SDK
#   - OpenWrt 原生 VMDK_IMAGES
#
# ============================================================

name: Build OpenWrt x86_64 BTF


# ============================================================
# 触发方式
#
# workflow_dispatch：
#   可以在 GitHub Actions 页面手动运行
#
# schedule：
#   每周自动检查并构建最新稳定版
# ============================================================

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"


# ============================================================
# GitHub Actions 权限
#
# contents: write
#   用于创建 GitHub Release 并上传构建产物
# ============================================================

permissions:
  contents: write


# ============================================================
# Job
# ============================================================

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # 安装 OpenWrt 官方编译所需依赖
      #
      # dwarves：
      #   提供 pahole
      #   OpenWrt BTF 构建需要使用它
      #
      # qemu-utils：
      #   提供 qemu-img
      #   用于将官方 IMG 转换为 VMDK
      # ======================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip \
            unzip \
            dwarves

          echo "========== TOOL VERSIONS =========="

          gcc --version | head -n 1
          clang --version | head -n 1
          pahole --version
          qemu-img --version | head -n 1

          echo "==================================="


      # ======================================================
      # 获取 OpenWrt 官方最新稳定版 Release
      #
      # 使用 GitHub Releases API：
      #
      #   /repos/openwrt/openwrt/releases/latest
      #
      # 不直接使用 main
      # 不从所有 tag 中自行排序
      # 不使用第三方仓库
      # ======================================================

      - name: Get latest OpenWrt stable release
        id: release
        shell: bash
        run: |
          set -e

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openwrt/openwrt/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])'
          )

          if [ -z "$VERSION" ]; then
            echo "ERROR: Failed to get latest OpenWrt release"
            exit 1
          fi

          # 确保获取到的是正式 Release Tag
          # 例如：
          #   v25.12.5
          #
          # 而不是：
          #   main
          #   rc
          #   其他异常字符串

          case "$VERSION" in
            v[0-9]*)
              ;;
            *)
              echo "ERROR: Invalid OpenWrt release tag: $VERSION"
              exit 1
              ;;
          esac

          echo "Latest OpenWrt stable release: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 下载 OpenWrt 官方 Release 源码
      #
      # 使用上一步获取的正式 Release Tag
      #
      # 例如：
      #   v25.12.5
      #
      # 不使用 main
      # ======================================================

      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -e

          git clone \
            --branch "${{ steps.release.outputs.version }}" \
            --depth 1 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "========== OPENWRT SOURCE =========="

          echo "OpenWrt commit:"
          git rev-parse HEAD

          echo "OpenWrt tag:"
          git describe --tags --always

          echo "===================================="


      # ======================================================
      # 更新并安装 OpenWrt 官方 feeds
      #
      # 这里使用 OpenWrt 自己的 feeds.conf.default
      #
      # 不加入任何第三方 feed
      # ======================================================

      - name: Update OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ======================================================
      # 创建 OpenWrt 编译配置
      #
      # 目标：
      #   x86_64
      #
      # BTF：
      #   CONFIG_KERNEL_DEBUG_INFO=y
      #   CONFIG_KERNEL_DEBUG_INFO_BTF=y
      #
      # 注意：
      #   BTF 依赖完整 DWARF 信息
      #   所以必须关闭：
      #   CONFIG_KERNEL_DEBUG_INFO_REDUCED
      #
      # RootFS：
      #   10240 MB = 10 GB
      #
      # VMDK：
      #   不设置 CONFIG_VMDK_IMAGES
      #   后续使用 qemu-img 单独转换
      # ======================================================

      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n

          CONFIG_TARGET_ROOTFS_PARTSIZE=10240
          EOF

          # 根据当前 OpenWrt 官方源码处理依赖关系
          make defconfig

          echo "========== FINAL CONFIGURATION =========="

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES|CONFIG_KERNEL_DEBUG_INFO_REDUCED|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_VMDK_IMAGES)' \
            .config || true

          echo "========================================="


      # ======================================================
      # 验证最终配置
      #
      # 这里不只是打印配置，而是主动检查。
      #
      # 如果 BTF / x86_64 / RootFS 配置不正确，
      # 直接停止整个 Workflow。
      # ======================================================

      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========== VERIFY CONFIGURATION =========="

          # x86 Target

          grep -q '^CONFIG_TARGET_x86=y$' .config || {
            echo "ERROR: CONFIG_TARGET_x86 is not enabled"
            exit 1
          }

          # x86_64 Subtarget

          grep -q '^CONFIG_TARGET_x86_64=y$' .config || {
            echo "ERROR: CONFIG_TARGET_x86_64 is not enabled"
            exit 1
          }

          # Kernel debug information

          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || {
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO is not enabled"
            exit 1
          }

          # BTF

          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || {
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_BTF is not enabled"
            exit 1
          }

          # Reduced DWARF 必须关闭

          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED is enabled"
            exit 1
          fi

          # RootFS 必须为 10240 MB

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config || {
            echo "ERROR: CONFIG_TARGET_ROOTFS_PARTSIZE is not 10240"
            exit 1
          }

          # 不允许使用 OpenWrt 原生 VMDK_IMAGES

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES must not be enabled"
            exit 1
          fi

          echo "x86: OK"
          echo "x86_64: OK"
          echo "DEBUG_INFO: OK"
          echo "BTF: OK"
          echo "DEBUG_INFO_REDUCED: disabled"
          echo "ROOTFS: 10240 MB"
          echo "VMDK_IMAGES: disabled"

          echo "All configuration checks passed."


      # ======================================================
      # 下载 OpenWrt 编译所需源码包
      #
      # 使用 -j2：
      #   降低 GitHub Runner 内存压力
      #
      # 同时保存 download.log：
      #   如果后续失败可以通过 Artifact 查看
      # ======================================================

      - name: Download packages
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make download -j2 V=s 2>&1 | tee download.log


      # ======================================================
      # 修改 OpenWrt 大尺寸 RootFS Padding
      #
      # OpenWrt 官方 image.mk 默认使用：
      #
      #   dd if=$(1) of=$(1).new bs=$(2) conv=sync
      #
      # 当 RootFS 设置为 10GB 时，
      # bs 可能直接达到约 10GB。
      #
      # 在 GitHub Runner 上可能产生非常大的内存压力。
      #
      # 所以这里：
      #
      #   CONFIG_TARGET_ROOTFS_PARTSIZE
      #       ↓
      #     仍然是 10240 MB
      #
      # 只修改文件扩展方式：
      #
      #   cp
      #   truncate
      #
      # 不改变最终镜像尺寸。
      #
      # 使用 start/end 定位，而不是依赖空格数量，
      # 避免不同源码格式导致替换失败。
      # ======================================================

      - name: Fix large rootfs padding
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("include/image.mk")
          text = path.read_text()

          # 找到 Image/pad-to 的开始位置

          start = text.find("define Image/pad-to")

          if start < 0:
              raise SystemExit(
                  "ERROR: Cannot find define Image/pad-to"
              )

          # 找到这个 define 对应的 endef

          end = text.find("\nendef", start)

          if end < 0:
              raise SystemExit(
                  "ERROR: Cannot find endef for Image/pad-to"
              )

          end += len("\nendef")

          # 使用 Makefile recipe 所需的 TAB
          # 不依赖原文件中的缩进空格数量

          new_block = """define Image/pad-to
          \t@size=$$(stat -c %s $(1)); \\
          \ttest $$size -le $(2) || { echo "ERROR: image is larger than requested size"; exit 1; }; \\
          \tcp $(1) $(1).new; \\
          \ttruncate -s $(2) $(1).new; \\
          \tmv $(1).new $(1)
          endef"""

          # 替换整个 Image/pad-to 区块

          path.write_text(
              text[:start]
              + new_block
              + text[end:]
          )

          print("Image/pad-to successfully modified.")
          PY

          echo "========== MODIFIED Image/pad-to =========="

          sed -n \
            '/define Image\/pad-to/,/endef/p' \
            include/image.mk

          echo "==========================================="


      # ======================================================
      # 编译 OpenWrt
      #
      # 使用 -j2：
      #   降低 GitHub Runner 因并行编译造成的内存压力
      #
      # V=s：
      #   输出完整编译信息
      #
      # tee：
      #   同时保存 build.log
      # ======================================================

      - name: Build OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make -j2 V=s 2>&1 | tee build.log


      # ======================================================
      # 检查官方 x86_64 构建结果
      #
      # 我们需要的是：
      #
      #   *combined-efi.img.gz
      #
      # 后面由它转换为 VMDK。
      # ======================================================

      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========== BUILD OUTPUT =========="

          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo "ERROR: combined-efi.img.gz not found"
            exit 1
          fi

          echo "Found official OpenWrt image:"
          echo "$IMG"


      # ======================================================
      # 将官方 combined-efi.img 转换为 VMDK
      #
      # 流程：
      #
      #   combined-efi.img.gz
      #          ↓
      #       gunzip
      #          ↓
      #       raw .img
      #          ↓
      #       qemu-img
      #          ↓
      #       .vmdk
      #
      # 不启用 CONFIG_VMDK_IMAGES。
      #
      # 不使用 streamOptimized。
      #
      # 不生成额外的 OpenWrt 原生 VMDK 文件。
      # ======================================================

      - name: Convert IMG to VMDK
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo "ERROR: combined-efi.img.gz not found"
            exit 1
          fi

          mkdir -p release

          # 解压官方 IMG

          gunzip -c \
            "$IMG" \
            > release/OpenWrt-x86_64-BTF-10G.img

          # 使用 qemu-img 转换为 VMDK
          #
          # 不指定 streamOptimized。
          # 因此这里不是 VMware streamOptimized VMDK。

          qe
```
