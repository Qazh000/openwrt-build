# ============================================================
# OpenWrt x86_64 BTF 自动构建
#
# 来源：
#   官方 OpenWrt
#
# 目标：
#   x86_64
#
# 功能：
#   1. 获取最新 OpenWrt stable Release
#   2. 开启 Kernel DEBUG_INFO
#   3. 开启 Kernel BTF
#   4. RootFS 10GB
#   5. 修复大 RootFS padding 的 dd 内存问题
#   6. 不启用 OpenWrt 原生 VMDK_IMAGES
#   7. 官方 combined-efi.img.gz -> 普通 VMDK
#   8. 计算未压缩 VMDK SHA256
#   9. ZIP 只包含 VMDK + SHA256
#   10. GitHub Release 只上传 ZIP
#
# 不使用：
#   - main
#   - ImmortalWrt
#   - 第三方 BTF
#   - 第三方 SDK
#   - ./scripts/config
#   - CONFIG_VMDK_IMAGES
# ============================================================

name: Build OpenWrt x86_64 BTF


# ============================================================
# 触发
# ============================================================

on:

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"


# ============================================================
# GitHub 权限
# ============================================================

permissions:
  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # 1. 安装编译依赖
      # ======================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            dwarves

          echo
          echo "========== TOOL VERSIONS =========="

          gcc --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1
          pahole --version
          qemu-img --version | head -n 1
          python3 --version

          echo
          echo "==================================="


      # ======================================================
      # 2. 获取最新稳定版
      #
      # GitHub Releases API
      #
      # 不使用 main
      # ======================================================

      - name: Get latest OpenWrt stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openwrt/openwrt/releases/latest \
            | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          print(data["tag_name"])
          '
          )"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Unable to determine OpenWrt release"
            exit 1
          fi

          case "$VERSION" in
            v[0-9]*)
              ;;
            *)
              echo "ERROR: Invalid release tag: $VERSION"
              exit 1
              ;;
          esac

          echo
          echo "=========================================="
          echo "Latest OpenWrt stable release: $VERSION"
          echo "=========================================="
          echo

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 3. 下载官方 OpenWrt Release
      # ======================================================

      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "${{ steps.release.outputs.version }}" \
            --depth 1 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo
          echo "========== OPENWRT SOURCE =========="

          echo "Tag:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "===================================="


      # ======================================================
      # 4. 官方 feeds
      # ======================================================

      - name: Update OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ======================================================
      # 5. 创建基础配置
      #
      # 注意：
      #
      # 不使用：
      #
      #   ./scripts/config
      #
      # 因为部分 OpenWrt 源码环境下：
      #
      #   scripts/config
      #
      # 是目录。
      #
      # 这里直接生成 .config。
      # ======================================================

      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n

          CONFIG_TARGET_ROOTFS_PARTSIZE=10240
          EOF

          echo
          echo "========== INITIAL CONFIG =========="

          cat .config

          echo
          echo "===================================="


      # ======================================================
      # 6. 让 OpenWrt 自动解析依赖
      # ======================================================

      - name: Run OpenWrt defconfig
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          make defconfig

          echo
          echo "========== FINAL CONFIG =========="

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES|CONFIG_KERNEL_DEBUG_INFO_REDUCED|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_VMDK_IMAGES)' \
            .config || true

          echo
          echo "=================================="


      # ======================================================
      # 7. 严格检查配置
      # ======================================================

      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========== VERIFY CONFIGURATION =========="
          echo

          # x86

          grep -q '^CONFIG_TARGET_x86=y$' .config || {
            echo "ERROR: CONFIG_TARGET_x86 is not enabled"
            exit 1
          }

          # x86_64

          grep -q '^CONFIG_TARGET_x86_64=y$' .config || {
            echo "ERROR: CONFIG_TARGET_x86_64 is not enabled"
            exit 1
          }

          # DEBUG INFO

          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || {
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO is not enabled"
            exit 1
          }

          # BTF

          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || {
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_BTF is not enabled"
            exit 1
          }

          # Reduced debug info 必须关闭

          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED is enabled"
            exit 1
          fi

          # RootFS

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config || {
            echo "ERROR: CONFIG_TARGET_ROOTFS_PARTSIZE is not 10240"
            exit 1
          }

          # 不允许 OpenWrt 原生 VMDK

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES is enabled"
            exit 1
          fi

          echo
          echo "x86                    : OK"
          echo "x86_64                 : OK"
          echo "DEBUG_INFO             : OK"
          echo "BTF                    : OK"
          echo "DEBUG_INFO_REDUCED     : disabled"
          echo "ROOTFS                 : 10240 MB"
          echo "VMDK_IMAGES            : disabled"
          echo
          echo "All configuration checks passed."
          echo


      # ======================================================
      # 8. 下载源码包
      #
      # -j2 降低 Runner 内存压力
      # ======================================================

      - name: Download packages
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make download -j2 V=s 2>&1 | tee download.log


      # ======================================================
      # 9. 修复大 RootFS 的 Image/pad-to
      #
      # OpenWrt 默认：
      #
      #   dd if=$(1) of=$(1).new bs=$(2) conv=sync
      #
      # 当 ROOTFS = 10GB 时：
      #
      #   bs = 10GB
      #
      # 可能导致 Runner 内存压力甚至 OOM。
      #
      # 改成：
      #
      #   cp
      #   truncate
      #
      # 不改变最终镜像大小。
      # ======================================================

      - name: Fix large rootfs padding
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("include/image.mk")

          if not path.exists():
              raise SystemExit(
                  "ERROR: include/image.mk does not exist"
              )

          text = path.read_text()

          start = text.find("define Image/pad-to")

          if start == -1:
              raise SystemExit(
                  "ERROR: Cannot find 'define Image/pad-to'"
              )

          end = text.find("\nendef", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Cannot find endef for Image/pad-to"
              )

          end += len("\nendef")

          new_block = """define Image/pad-to
          \t@size=$$(stat -c %s $(1)); \\
          \ttest $$size -le $(2) || { echo "ERROR: image is larger than requested size"; exit 1; }; \\
          \tcp $(1) $(1).new; \\
          \ttruncate -s $(2) $(1).new; \\
          \tmv $(1).new $(1)
          endef"""

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          path.write_text(text)

          print("Image/pad-to successfully modified.")
          PY

          echo
          echo "========== Image/pad-to =========="

          sed -n \
            '/define Image\/pad-to/,/endef/p' \
            include/image.mk

          echo
          echo "=================================="


      # ======================================================
      # 10. 再检查修改是否真的生效
      # ======================================================

      - name: Verify rootfs padding patch
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'truncate -s $(2) $(1).new' include/image.mk || {
            echo "ERROR: Image/pad-to patch was not applied"
            exit 1
          }

          if grep -A5 \
            '^define Image/pad-to' \
            include/image.mk \
            | grep -q 'bs=$(2)'; then

            echo "ERROR: Old dd bs=$(2) implementation still exists"
            exit 1
          fi

          echo "Image/pad-to patch verified."


      # ======================================================
      # 11. 编译
      #
      # -j2：
      #   控制内存使用
      #
      # V=s：
      #   输出详细日志
      # ======================================================

      - name: Build OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make -j2 V=s 2>&1 | tee build.log


      # ======================================================
      # 12. 检查构建结果
      # ======================================================

      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========== BUILD OUTPUT =========="

          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=================================="


          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo
            echo "ERROR: combined-efi.img.gz not found"
            echo
            exit 1
          fi

          echo
          echo "Found:"
          echo "$IMG"


      # ======================================================
      # 13. IMG -> VMDK
      #
      # 不使用 CONFIG_VMDK_IMAGES
      #
      # 不使用 streamOptimized
      # ======================================================

      - name: Convert IMG to VMDK
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo "ERROR: combined-efi.img.gz not found"
            exit 1
          fi

          mkdir -p release

          echo
          echo "Extracting official combined-efi image..."

          gunzip -c \
            "$IMG" \
            > release/OpenWrt-x86_64-BTF-10G.img

          echo
          echo "Converting RAW IMG to VMDK..."

          qemu-img convert \
            -f raw \
            -O vmdk \
            release/OpenWrt-x86_64-BTF-10G.img \
            release/OpenWrt-x86_64-BTF-10G.vmdk

          rm -f \
            release/OpenWrt-x86_64-BTF-10G.img

          echo
          echo "========== VMDK INFO =========="

          qemu-img info \
            release/OpenWrt-x86_64-BTF-10G.vmdk

          echo
          echo "==============================="


      # ======================================================
      # 14. SHA256
      # ======================================================

      - name: Generate SHA256
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "========== SHA256 =========="

          cat \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "============================"


      # ======================================================
      # 15. 创建 ZIP
      #
      # ZIP 严格只包含：
      #
      #   VMDK
      #   SHA256
      # ======================================================

      - name: Create ZIP package
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cd release

          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "========== ZIP CONTENTS =========="

          unzip -l \
            OpenWrt-x86_64-BTF-10G.zip

          echo
          echo "=================================="


      # ======================================================
      # 16. 最终文件检查
      # ======================================================

      - name: Verify final package
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            release/OpenWrt-x86_64-BTF-10G.vmdk

          test -f \
            release/OpenWrt-x86_64-BTF-10G.vmdk.sha256

          test -f \
            release/OpenWrt-x86_64-BTF-10G.zip

          echo
          echo "========== RELEASE FILES =========="

          ls -lh release/

          echo
          echo "==================================="


      # ======================================================
      # 17. 构建失败上传日志
      # ======================================================

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-build-logs
          path: |
            openwrt/build.log
            openwrt/download.log
            openwrt/.config
            openwrt/include/image.mk
            openwrt/bin/targets/x86/64/
          if-no-files-found: warn
          retention-days: 7


      # ======================================================
      # 18. 创建 GitHub Release
      # ======================================================

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ steps.release.outputs.version }}-btf-10g

          name: OpenWrt ${{ steps.release.outputs.version }} x86_64 BTF 10G

          body: |
            OpenWrt official stable release

            Version: ${{ steps.release.outputs.version }}

            Architecture: x86_64

            Kernel DEBUG_INFO: enabled

            Kernel BTF: enabled

            RootFS: 10GB

            VMDK:
              Converted from official combined-efi.img

            CONFIG_VMDK_IMAGES:
              disabled

            SHA256:
              included

          files: |
            openwrt/release/OpenWrt-x86_64-BTF-10G.zip
