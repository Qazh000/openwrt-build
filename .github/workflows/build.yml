name: Build OpenWrt x86_64 BTF 10G VMDK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # Find the latest stable OpenWrt release tag.
      # Only tags such as v25.12.5 are accepted.
      # Development branches such as main are never used.
      # ============================================================
      - name: Find latest stable OpenWrt
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --tags --refs https://github.com/openwrt/openwrt.git \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 > latest_version.txt

          if [ ! -s latest_version.txt ]; then
            echo "ERROR: Failed to find latest stable OpenWrt release."
            exit 1
          fi

          LATEST_VERSION="$(cat latest_version.txt)"

          echo "Latest stable OpenWrt: ${LATEST_VERSION}"
          echo "version=${LATEST_VERSION}" >> "${GITHUB_OUTPUT}"


      # ============================================================
      # Checkout the official OpenWrt source.
      # ============================================================
      - name: Checkout official OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ steps.stable.outputs.version }}
          fetch-depth: 1


      # ============================================================
      # Install build dependencies.
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip \
            unzip


      # ============================================================
      # Update and install the official OpenWrt feeds.
      # ============================================================
      - name: Update OpenWrt feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ============================================================
      # Configure OpenWrt.
      #
      # Only the following requested settings are explicitly changed:
      #
      #   TARGET_x86_64
      #   KERNEL_DEBUG_INFO
      #   KERNEL_DEBUG_INFO_BTF
      #   KERNEL_DEBUG_INFO_REDUCED
      #   TARGET_ROOTFS_PARTSIZE
      #
      # VMDK_IMAGES is NOT enabled.
      # All other options are resolved by the official defconfig.
      # ============================================================
      - name: Configure OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_TARGET_ROOTFS_PARTSIZE=10240
          EOF

          make defconfig

          echo
          echo "===== Final OpenWrt configuration ====="

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_DEBUG_INFO_REDUCED|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_VMDK_IMAGES)=' \
            .config || true

          echo


      # ============================================================
      # Verify the final configuration.
      # ============================================================
      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Verify target ====="

          grep -q '^CONFIG_TARGET_x86=y$' .config
          grep -q '^CONFIG_TARGET_x86_64=y$' .config

          echo "===== Verify BTF ====="

          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config

          echo "===== Verify RootFS size ====="

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config

          echo "===== Verify reduced debug information ====="

          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED is enabled."
            exit 1
          fi

          echo "===== Verify VMDK image generation ====="

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES must NOT be enabled."
            exit 1
          fi

          echo
          echo "Configuration verification passed."


      # ============================================================
      # Download all required OpenWrt sources.
      # ============================================================
      - name: Download OpenWrt sources
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)"


      # ============================================================
      # Build OpenWrt.
      # ============================================================
      - name: Build OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=s


      # ============================================================
      # Locate the official x86_64 combined EFI image.
      # ============================================================
      - name: Locate OpenWrt image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*squashfs*combined-efi.img.gz' \
              | sort \
              | head -n 1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: Official x86_64 combined EFI image was not found."
            echo
            echo "===== Available files ====="
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "Found image:"
          echo "${IMAGE}"

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"


      # ============================================================
      # Prepare working directories.
      # ============================================================
      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          mkdir -p output


      # ============================================================
      # Decompress the official OpenWrt IMG.
      # ============================================================
      - name: Decompress OpenWrt image
        shell: bash
        run: |
          set -euo pipefail

          gzip -dc \
            "${{ steps.image.outputs.image }}" \
            > work/OpenWrt-x86_64-BTF-10G.img

          file work/OpenWrt-x86_64-BTF-10G.img

          ls -lh work/OpenWrt-x86_64-BTF-10G.img


      # ============================================================
      # Convert the RAW IMG to VMDK.
      #
      # No streamOptimized option is used.
      # ============================================================
      - name: Convert IMG to VMDK
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk

          qemu-img info \
            output/OpenWrt-x86_64-BTF-10G.vmdk

          ls -lh \
            output/OpenWrt-x86_64-BTF-10G.vmdk


      # ============================================================
      # Calculate SHA256 of the uncompressed VMDK itself.
      # ============================================================
      - name: Calculate VMDK SHA256
        shell: bash
        working-directory: output
        run: |
          set -euo pipefail

          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo "===== SHA256 ====="
          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256


      # ============================================================
      # Create ZIP.
      #
      # The ZIP contains ONLY:
      #
      #   OpenWrt-x86_64-BTF-10G.vmdk
      #   OpenWrt-x86_64-BTF-10G.vmdk.sha256
      # ============================================================
      - name: Create ZIP package
        shell: bash
        working-directory: output
        run: |
          set -euo pipefail

          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "===== ZIP contents ====="

          unzip -l \
            OpenWrt-x86_64-BTF-10G.zip


      # ============================================================
      # Verify that the ZIP contains exactly the two required files.
      # ============================================================
      - name: Verify ZIP package
        shell: bash
        working-directory: output
        run: |
          set -euo pipefail

          EXPECTED_1="OpenWrt-x86_64-BTF-10G.vmdk"
          EXPECTED_2="OpenWrt-x86_64-BTF-10G.vmdk.sha256"

          ACTUAL_FILES="$(
            unzip -Z1 OpenWrt-x86_64-BTF-10G.zip \
              | sort
          )"

          EXPECTED_FILES="$(
            printf '%s\n%s\n' \
              "${EXPECTED_1}" \
              "${EXPECTED_2}" \
              | sort
          )"

          if [ "${ACTUAL_FILES}" != "${EXPECTED_FILES}" ]; then
            echo "ERROR: ZIP contents are incorrect."
            echo
            echo "Expected:"
            printf '%s\n' "${EXPECTED_FILES}"
            echo
            echo "Actual:"
            printf '%s\n' "${ACTUAL_FILES}"
            exit 1
          fi

          echo "ZIP verification passed."


      # ============================================================
      # Remove the VMDK and SHA256 from the workspace.
      #
      # Only the ZIP remains for the GitHub Release.
      # ============================================================
      - name: Remove intermediate files
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/OpenWrt-x86_64-BTF-10G.vmdk \
            output/OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo "===== Release files ====="

          find output \
            -maxdepth 1 \
            -type f \
            -print


      # ============================================================
      # Create GitHub Release.
      #
      # Only the ZIP is uploaded.
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stable.outputs.version }}
          name: OpenWrt ${{ steps.stable.outputs.version }} x86_64 BTF 10G

          body: |
            ## OpenWrt x86_64 BTF 10G

            - Source: official openwrt/openwrt
            - Release: ${{ steps.stable.outputs.version }}
            - Target: x86_64
            - Kernel BTF: enabled
            - RootFS partition: 10240 MiB (10 GiB)
            - Image: official x86_64 combined EFI
            - VMDK: converted from official IMG
            - SHA256: included inside ZIP

          files: |
            output/OpenWrt-x86_64-BTF-10G.zip

          make_latest: true
          fail_on_unmatched_files: true
