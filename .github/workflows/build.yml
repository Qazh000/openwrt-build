# ============================================================
# OpenWrt x86_64 官方源码编译
#
# 功能：
# 1. 自动获取最新稳定版 OpenWrt
# 2. 使用官方 openwrt/openwrt 源码
# 3. 构建官方 x86_64 镜像
# 4. 仅开启 Kernel BTF
# 5. RootFS 分区设置为 10 GiB
# 6. 官方 IMG 转换为 VMDK
# 7. 计算 VMDK SHA256
# 8. VMDK + SHA256 压缩成 ZIP
# 9. GitHub Release 只上传 ZIP
# ============================================================

name: Build OpenWrt x86_64 BTF 10G VMDK

# 手动运行
on:
  workflow_dispatch:

# GitHub Release 所需权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ======================================================
      # 1. 获取最新稳定版 OpenWrt
      # ======================================================

      - name: Find latest stable OpenWrt
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION="$(
            git ls-remote --tags --refs https://github.com/openwrt/openwrt.git \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )

          if [ -z "$LATEST_VERSION" ]; then
            echo "Failed to find latest stable OpenWrt version."
            exit 1
          fi

          echo "Latest stable OpenWrt: $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 2. 下载官方 OpenWrt 源码
      # ======================================================

      - name: Checkout official OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ steps.stable.outputs.version }}
          fetch-depth: 1


      # ======================================================
      # 3. 安装编译依赖
      # ======================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip


      # ======================================================
      # 4. 更新官方 feeds
      # ======================================================

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # ======================================================
      # 5. 选择官方 x86_64
      #
      # x86 没有额外 Device Profile
      # ======================================================

      - name: Select x86_64 target
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable TARGET_x86 \
            --enable TARGET_x86_64


      # ======================================================
      # 6. 仅开启 Kernel BTF
      #
      # BTF 需要：
      # KERNEL_DEBUG_INFO=y
      # KERNEL_DEBUG_INFO_BTF=y
      # KERNEL_DEBUG_INFO_REDUCED=n
      # ======================================================

      - name: Enable BTF
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --enable KERNEL_DEBUG_INFO \
            --enable KERNEL_DEBUG_INFO_BTF \
            --disable KERNEL_DEBUG_INFO_REDUCED


      # ======================================================
      # 7. RootFS 分区设置为 10 GiB
      #
      # 10240 MiB = 10 GiB
      #
      # 注意：
      # 这里是 RootFS 分区总大小，不是剩余可写空间。
      # ======================================================

      - name: Set RootFS partition size to 10 GiB
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/config \
            --set-val TARGET_ROOTFS_PARTSIZE 10240


      # ======================================================
      # 8. 生成最终配置
      # ======================================================

      - name: Generate default configuration
        shell: bash
        run: |
          set -euo pipefail

          make defconfig


      # ======================================================
      # 9. 检查最终配置
      # ======================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Target ====="
          grep -E '^CONFIG_TARGET_x86(_64)?=y$' .config || true

          echo
          echo "===== BTF ====="
          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?=' .config || true

          echo
          echo "===== RootFS ====="
          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true

          echo
          echo "===== VMDK_IMAGES ====="
          grep -E '^CONFIG_VMDK_IMAGES=' .config || true

          echo
          echo "===== Verification ====="

          grep -q '^CONFIG_TARGET_x86=y$' .config
          grep -q '^CONFIG_TARGET_x86_64=y$' .config

          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config

          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED must be disabled."
            exit 1
          fi

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "ERROR: CONFIG_VMDK_IMAGES must remain disabled."
            exit 1
          fi

          echo
          echo "Configuration verification passed."


      # ======================================================
      # 10. 下载软件包源码
      # ======================================================

      - name: Download package sources
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)"


      # ======================================================
      # 11. 编译 OpenWrt
      # ======================================================

      - name: Build OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=s


      # ======================================================
      # 12. 查找官方 x86_64 EFI SquashFS 镜像
      # ======================================================

      - name: Locate official x86_64 image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*squashfs*combined-efi.img.gz' \
              | head -n 1
          )

          if [ -z "$IMAGE" ]; then
            echo "OpenWrt x86_64 combined EFI image not found."

            echo
            echo "Available images:"

            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          echo "Found image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 13. 解压 IMG
      # ======================================================

      - name: Extract raw IMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          mkdir -p output

          gzip -dc \
            "${{ steps.image.outputs.image }}" \
            > work/OpenWrt-x86_64-BTF-10G.img

          echo
          echo "===== Raw IMG ====="

          ls -lh work/OpenWrt-x86_64-BTF-10G.img


      # ======================================================
      # 14. IMG 转 VMDK
      #
      # 使用标准 qemu-img 转换
      # 不使用 streamOptimized
      # ======================================================

      - name: Convert IMG to VMDK
        shell: bash
        run: |
          set -euo pipefail

          qemu-img convert \
            -f raw \
            -O vmdk \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk

          echo
          echo "===== VMDK ====="

          ls -lh output/OpenWrt-x86_64-BTF-10G.vmdk

          echo
          echo "===== VMDK info ====="

          qemu-img info output/OpenWrt-x86_64-BTF-10G.vmdk


      # ======================================================
      # 15. 计算 VMDK SHA256
      #
      # 计算的是原始 VMDK 文件
      # ======================================================

      - name: Generate VMDK SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd output

          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "===== VMDK SHA256 ====="

          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256


      # ======================================================
      # 16. VMDK + SHA256 压缩成 ZIP
      # ======================================================

      - name: Compress VMDK
        shell: bash
        run: |
          set -euo pipefail

          cd output

          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "===== ZIP ====="

          ls -lh OpenWrt-x86_64-BTF-10G.zip


      # ======================================================
      # 17. 删除中间文件
      #
      # 最终只留下 ZIP
      # ======================================================

      - name: Remove intermediate files
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            work/OpenWrt-x86_64-BTF-10G.img \
            output/OpenWrt-x86_64-BTF-10G.vmdk \
            output/OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo
          echo "===== Remaining files ====="

          find output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'


      # ======================================================
      # 18. 创建 GitHub Release
      #
      # 只上传 ZIP
      # ======================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stable.outputs.version }}
          name: OpenWrt ${{ steps.stable.outputs.version }} x86_64 BTF 10G

          body: |
            ## OpenWrt x86_64

            - Source: official openwrt/openwrt
            - Target: x86_64
            - Kernel BTF: enabled
            - RootFS partition: 10240 MiB (10 GiB)
            - Image: official x86_64 combined EFI image
            - VMDK: converted from official IMG
            - SHA256: VMDK checksum included

          files: |
            output/OpenWrt-x86_64-BTF-10G.zip

          make_latest: true
          fail_on_unmatched_files: true
