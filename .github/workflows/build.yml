```yaml
name: Build OpenWrt x86_64 BTF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 安装 OpenWrt 官方编译所需依赖
      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip \
            unzip \
            dwarves

          echo "========== 工具版本 =========="
          gcc --version | head -n 1
          clang --version | head -n 1
          pahole --version
          qemu-img --version | head -n 1
          echo "=============================="

      # 获取 OpenWrt 官方最新稳定版 Release
      - name: Get latest OpenWrt stable release
        id: release
        shell: bash
        run: |
          set -e

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openwrt/openwrt/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])'
          )"

          if [ -z "$VERSION" ]; then
            echo "错误：无法获取 OpenWrt 最新稳定版"
            exit 1
          fi

          case "$VERSION" in
            v[0-9]*)
              ;;
            *)
              echo "错误：GitHub 返回的 Release Tag 不符合预期：$VERSION"
              exit 1
              ;;
          esac

          echo "OpenWrt 最新稳定版：$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 下载 OpenWrt 官方 Release 源码
      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -e

          git clone \
            --branch "${{ steps.release.outputs.version }}" \
            --depth 1 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "OpenWrt commit："
          git rev-parse HEAD

          echo "OpenWrt tag："
          git describe --tags --always

      # 更新并安装 OpenWrt 官方 feeds
      - name: Update OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 创建 x86_64 + BTF + 10GB RootFS 配置
      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n

          CONFIG_TARGET_ROOTFS_PARTSIZE=10240
          EOF

          make defconfig

          echo "========== 最终关键配置 =========="

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES|CONFIG_KERNEL_DEBUG_INFO_REDUCED|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_VMDK_IMAGES)' \
            .config || true

          echo "==================================="

      # 验证最终配置
      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========== 验证配置 =========="

          grep -q '^CONFIG_TARGET_x86=y$' .config || {
            echo "错误：CONFIG_TARGET_x86 未启用"
            exit 1
          }

          grep -q '^CONFIG_TARGET_x86_64=y$' .config || {
            echo "错误：CONFIG_TARGET_x86_64 未启用"
            exit 1
          }

          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || {
            echo "错误：CONFIG_KERNEL_DEBUG_INFO 未启用"
            exit 1
          }

          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || {
            echo "错误：CONFIG_KERNEL_DEBUG_INFO_BTF 未启用"
            exit 1
          }

          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "错误：CONFIG_KERNEL_DEBUG_INFO_REDUCED 被启用"
            exit 1
          fi

          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240$' .config || {
            echo "错误：CONFIG_TARGET_ROOTFS_PARTSIZE 不是 10240"
            exit 1
          }

          if grep -q '^CONFIG_VMDK_IMAGES=y$' .config; then
            echo "错误：CONFIG_VMDK_IMAGES 不应该启用"
            exit 1
          fi

          echo "x86：通过"
          echo "x86_64：通过"
          echo "DEBUG_INFO：通过"
          echo "BTF：通过"
          echo "DEBUG_INFO_REDUCED：未启用"
          echo "RootFS：10240 MB"
          echo "VMDK_IMAGES：未启用"
          echo "所有配置验证通过"

      # 下载编译所需源码包
      - name: Download packages
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make download -j2 V=s 2>&1 | tee download.log

      # 修改 OpenWrt 10GB RootFS 填充方式
      # 官方 image.mk 使用 dd bs=10GB，在 GitHub Runner 上可能造成严重内存压力。
      # 这里保持 CONFIG_TARGET_ROOTFS_PARTSIZE=10240 不变，
      # 只将大块 dd 改成 cp + truncate，避免一次申请 10GB 内存。
      - name: Fix large rootfs padding
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("include/image.mk")
          text = path.read_text()

          old = """define Image/pad-to
          dd if=$(1) of=$(1).new bs=$(2) conv=sync
          mv $(1).new $(1)
          endef"""

          new = """define Image/pad-to
          @size=$$(stat -c %s $(1)); \\
          test $$size -le $(2) || { echo "ERROR: image is larger than requested padding size"; exit 1; }; \\
          cp $(1) $(1).new; \\
          truncate -s $(2) $(1).new; \\
          mv $(1).new $(1)
          endef"""

          if old not in text:
              raise SystemExit(
                  "错误：未找到预期的 Image/pad-to 代码，"
                  "OpenWrt 源码结构可能已经发生变化。"
              )

          path.write_text(text.replace(old, new, 1))

          print("已修改 include/image.mk 的 Image/pad-to")
          PY

          echo "========== 修改后的 Image/pad-to =========="
          sed -n '/define Image\/pad-to/,/endef/p' include/image.mk
          echo "==========================================="

      # 编译 OpenWrt
      # 使用 -j2，避免 GitHub Runner 因并行编译造成过高内存压力
      - name: Build OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          make -j2 V=s 2>&1 | tee build.log

      # 检查编译结果
      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========== x86_64 构建输出 =========="

          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo "错误：没有找到 combined-efi.img.gz"
            exit 1
          fi

          echo "找到官方 IMG：$IMG"

      # 将官方 combined-efi.img 转换为 VMDK
      - name: Convert IMG to VMDK
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          IMG="$(
            find bin/targets/x86/64 \
              -maxdepth 1 \
              -type f \
              -name '*combined-efi.img.gz' \
              | head -n 1
          )"

          if [ -z "$IMG" ]; then
            echo "错误：找不到 combined-efi.img.gz"
            exit 1
          fi

          mkdir -p release

          gunzip -c "$IMG" > release/OpenWrt-x86_64-BTF-10G.img

          qemu-img convert \
            -f raw \
            -O vmdk \
            release/OpenWrt-x86_64-BTF-10G.img \
            release/OpenWrt-x86_64-BTF-10G.vmdk

          rm -f release/OpenWrt-x86_64-BTF-10G.img

          echo "========== VMDK 信息 =========="
          qemu-img info release/OpenWrt-x86_64-BTF-10G.vmdk
          echo "==============================="

      # 对未压缩 VMDK 本体计算 SHA256
      - name: Generate SHA256
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          cd release

          sha256sum \
            OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo "========== SHA256 =========="
          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256
          echo "============================"

      # 创建最终 ZIP
      # ZIP 只包含 VMDK 和 SHA256
      - name: Create ZIP package
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          cd release

          zip -9 \
            OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          echo "========== ZIP 内容 =========="
          unzip -l OpenWrt-x86_64-BTF-10G.zip
          echo "=============================="

      # 显示最终文件
      - name: Show release files
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          echo "========== Release 文件 =========="
          ls -lh release/
          echo "==================================="

      # 构建失败时上传日志和配置
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-build-logs
          path: |
            openwrt/build.log
            openwrt/download.log
            openwrt/.config
            openwrt/include/image.mk
            openwrt/bin/targets/x86/64/
          if-no-files-found: warn
          retention-days: 7

      # 创建 GitHub Release
      # Release 只上传最终 ZIP
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}-btf-10g
          name: OpenWrt ${{ steps.release.outputs.version }} x86_64 BTF 10G
          body: |
            OpenWrt 官方稳定版

            版本：${{ steps.release.outputs.version }}

            架构：x86_64

            BTF：启用

            RootFS：10GB

            VMDK：由官方 combined-efi.img 转换

            VMDK_IMAGES：未启用

            SHA256：已提供
          files: |
            openwrt/release/OpenWrt-x86_64-BTF-10G.zip
```
