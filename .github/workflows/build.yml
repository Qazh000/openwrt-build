```yaml
name: Build OpenWrt x86_64 BTF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            qemu-utils \
            zip \
            unzip \
            bc \
            cpio \
            dwarves

      - name: Check runner resources
        shell: bash
        run: |
          set -eux

          echo "========== CPU =========="
          nproc

          echo "========== MEMORY =========="
          free -h

          echo "========== DISK =========="
          df -h

          echo "========== SWAP =========="
          swapon --show || true

      - name: Get latest stable OpenWrt release
        id: release
        shell: bash
        run: |
          set -eux

          LATEST_TAG="$(git ls-remote --tags --refs \
            https://github.com/openwrt/openwrt.git \
            'v*' \
            | awk -F/ '{print $3}' \
            | sort -V \
            | tail -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to detect latest OpenWrt release tag"
            exit 1
          fi

          echo "Latest stable release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenWrt
        shell: bash
        run: |
          set -eux

          git clone --depth 1 \
            --branch "${{ steps.release.outputs.tag }}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate minimal configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n

          CONFIG_TARGET_ROOTFS_PARTSIZE=10240
          EOF

          make defconfig

      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          echo "========== Target =========="
          grep -E '^CONFIG_TARGET_x86(=|_)' .config || true

          echo "========== BTF =========="
          grep -E '^CONFIG_KERNEL_DEBUG_INFO' .config || true

          echo "========== RootFS =========="
          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config

          echo "========== VMDK =========="
          grep -E '^CONFIG_VMDK_IMAGES=' .config || true

          test "$(grep -E '^CONFIG_TARGET_x86_64=y' .config)"
          test "$(grep -E '^CONFIG_KERNEL_DEBUG_INFO=y' .config)"
          test "$(grep -E '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config)"
          test "$(grep -E '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=n' .config)"
          test "$(grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=10240' .config)"

          if grep -q '^CONFIG_VMDK_IMAGES=y' .config; then
            echo "CONFIG_VMDK_IMAGES must not be enabled"
            exit 1
          fi

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          make download -j2

      - name: Build OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          (
            while true; do
              echo "[heartbeat] $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "[heartbeat] Memory:"
              free -h || true
              echo "[heartbeat] Disk:"
              df -h / || true
              sleep 60
            done
          ) &

          HEARTBEAT_PID=$!

          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          make -j2 V=s 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log
          path: openwrt/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate firmware image
        id: image
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          IMAGE="$(find bin/targets/x86/64 -type f \
            -name '*squashfs*combined-efi.img.gz' \
            | head -n 1)"

          if [ -z "$IMAGE" ]; then
            echo "OpenWrt combined EFI image not found"
            find bin/targets/x86/64 -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "Found image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Convert IMG to VMDK
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          IMAGE="${{ steps.image.outputs.image }}"

          cp "$IMAGE" /tmp/openwrt.img.gz
          gzip -dc /tmp/openwrt.img.gz > /tmp/OpenWrt-x86_64-BTF-10G.img

          qemu-img convert \
            -f raw \
            -O vmdk \
            /tmp/OpenWrt-x86_64-BTF-10G.img \
            /tmp/OpenWrt-x86_64-BTF-10G.vmdk

          qemu-img info /tmp/OpenWrt-x86_64-BTF-10G.vmdk

      - name: Generate SHA256
        shell: bash
        run: |
          set -eux

          cd /tmp

          sha256sum OpenWrt-x86_64-BTF-10G.vmdk \
            > OpenWrt-x86_64-BTF-10G.vmdk.sha256

          cat OpenWrt-x86_64-BTF-10G.vmdk.sha256

      - name: Create ZIP package
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/openwrt-release
          mkdir -p /tmp/openwrt-release

          cp /tmp/OpenWrt-x86_64-BTF-10G.vmdk \
            /tmp/openwrt-release/

          cp /tmp/OpenWrt-x86_64-BTF-10G.vmdk.sha256 \
            /tmp/openwrt-release/

          cd /tmp/openwrt-release

          zip -9 \
            /tmp/OpenWrt-x86_64-BTF-10G.zip \
            OpenWrt-x86_64-BTF-10G.vmdk \
            OpenWrt-x86_64-BTF-10G.vmdk.sha256

          unzip -l /tmp/OpenWrt-x86_64-BTF-10G.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ steps.release.outputs.tag }}-x86_64-btf-10g
          name: OpenWrt ${{ steps.release.outputs.tag }} x86_64 BTF 10G
          body: |
            Official OpenWrt x86_64 build.

            Source:
            https://github.com/openwrt/openwrt

            Release:
            ${{ steps.release.outputs.tag }}

            Features:
            - x86_64
            - Kernel BTF enabled
            - 10GB root filesystem
            - VMDK generated from official IMG
            - Uncompressed VMDK
          files: |
            /tmp/OpenWrt-x86_64-BTF-10G.zip
          fail_on_unmatched_files: true
```
